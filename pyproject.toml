[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "group-chat-explorer"
version = "0.1.0"
description = "A local, evidence-linked explorer for your group chat history"
requires-python = ">=3.11,<3.15"
license = "GPL-3.0-only"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.32,<1", "pydantic>=2.10,<3", "numpy>=2,<3", "httpx>=0.28,<1", "keyring>=25,<26", "pillow>=11,<13", "imagehash>=4.3,<5", "nltk>=3.9,<4"]

[project.optional-dependencies]
analysis = ["sentence-transformers>=3,<6", "hnswlib>=0.8,<1", "scikit-learn>=1.5,<2", "hdbscan>=0.8,<1", "openai-whisper>=20240930"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
gcapp = "gcapp.cli:main"

[tool.setuptools.packages.find]
include = ["gcapp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
